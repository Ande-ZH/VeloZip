name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write   # required for release publishing on tag builds

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - test-java: '17'
            netty: '4.1.68.Final'
          - test-java: '25'
            netty: '4.2.7.Final'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Transport and adapter compatibility
        run: ./gradlew test -PtestJavaVersion=${{ matrix.test-java }} -PnettyTestVersion=${{ matrix.netty }} --no-daemon

  build:
    needs: compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}

      # Full build: unit tests (PARANOID leak detection) + shadow jars.
      # Output is teed to a log file so failures are diagnosable from the
      # uploaded artifact (no admin API access needed to read it).
      # shell: bash gives -eo pipefail; without it, the tee pipeline masks
      # gradlew's exit code (bit us once: an exec-bit failure showed as
      # "Build success" with an empty log and broke the checksums step).
      - name: Build (tests + shadow jars)
        shell: bash
        run: ./gradlew build --stacktrace --no-daemon 2>&1 | tee build-output.log

      - name: Generate checksums
        working-directory: ${{ github.workspace }}
        run: |
          PROJECT_VERSION=$(sed -n 's/^version=//p' gradle.properties)
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"
          (cd velozip-velocity/build/libs && sha256sum "VeloZip-Velocity-${PROJECT_VERSION}.jar") > checksums.txt
          (cd velozip-backend/build/libs && sha256sum "VeloZip-Backend-${PROJECT_VERSION}.jar") >> checksums.txt
          cat checksums.txt

      - name: Upload jars (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: VeloZip-jars
          path: |
            velozip-velocity/build/libs/VeloZip-Velocity-*.jar
            velozip-backend/build/libs/VeloZip-Backend-*.jar
            !**/*-thin.jar
            checksums.txt
          if-no-files-found: error

      # Always upload build output/logs on failure so the cause is visible
      # without admin API access (repo is public but logs API needs auth).
      - name: Upload build diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: |
            build-output.log
            **/build/reports/
          if-no-files-found: error
          retention-days: 7

      # Tag builds publish a GitHub Release with the two jars + checksums.
      # Release notes: .github/releases/<tag>.md when present, else generated.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES=".github/releases/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            # Fallback: derive notes from the CHANGELOG section of this tag.
            python3 - "$TAG" <<'PYEOF' > release-notes-fallback.md
          import re, sys
          tag = sys.argv[1].lstrip('v')
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'## \[' + re.escape(tag) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)', text, re.S)
          print(m.group(1).strip() if m else f'VeloZip {tag}')
          PYEOF
            NOTES="release-notes-fallback.md"
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "VeloZip $TAG" \
            --notes-file "$NOTES" \
            "velozip-velocity/build/libs/VeloZip-Velocity-${PROJECT_VERSION}.jar" \
            "velozip-backend/build/libs/VeloZip-Backend-${PROJECT_VERSION}.jar" \
            checksums.txt

      # Quick smoke benchmark on branch builds only (keeps tag builds fast).
      - name: Run JMH (subset)
        if: github.ref_type != 'tag'
        run: |
          ./gradlew :velozip-benchmark:jmh \
            -PjmhArgs="CompressionBenchmark.compressOnly -wi 1 -i 1 -f 1 -t 1 -p size=4096,65536 -p dataset=MC_LIKE" \
            --no-daemon
