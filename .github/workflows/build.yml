name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build (tests + shadow jars)
        run: ./gradlew build
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: VeloZip-jars
          path: |
            velozip-velocity/build/libs/VeloZip-Velocity-*.jar
            velozip-backend/build/libs/VeloZip-Backend-*.jar
          if-no-files-found: error
      - name: Run JMH (subset)
        run: |
          ./gradlew :velozip-benchmark:jmh \
            -PjmhArgs="CompressionBenchmark.compressOnly -wi 1 -i 1 -f 1 -t 1 -p size=4096,65536 -p dataset=MC_LIKE"